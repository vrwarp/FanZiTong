name: Publish agent image

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'src/lib/assistant/**'
      - 'src/types/index.ts'
      - '.github/workflows/publish-agent.yml'
  workflow_dispatch:

concurrency:
  group: publish-agent
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fanzitong-agent
          tags: |
            type=raw,value=latest
            type=sha,format=short
      # arm64 covers a Raspberry Pi or an ARM NAS; the Claude Code binary ships
      # per platform, so both are built rather than assumed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

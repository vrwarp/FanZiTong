# Two ways to reach the sidecar from a phone, both terminating TLS in front of
# it. The agent port is never published on its own: the pairing token is the
# only credential, so nothing that speaks plain HTTP should see it.
#
#   docker compose --profile tailscale up -d     (recommended: private tailnet)
#   docker compose --profile caddy up -d         (public domain)
#
# Credentials: put CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` in .env,
# or leave it empty and run once:
#   docker compose exec -it agent claude auth login

services:
  agent:
    image: ghcr.io/vrwarp/fanzitong-agent:latest
    build:
      context: ..
      dockerfile: agent/Dockerfile
    env_file: .env
    environment:
      FZT_AGENT_HOST: 0.0.0.0
    volumes:
      - claude-data:/data
    restart: unless-stopped
    # The tailscale profile replaces this with the sidecar's namespace.
    networks: [default]

  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:latest
    hostname: fanzitong-agent
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_HOSTNAME: fanzitong-agent
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    cap_add: [net_admin, net_raw]
    restart: unless-stopped

  caddy:
    profiles: [caddy]
    image: caddy:2
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  claude-data:
  tailscale-state:
  caddy-data:

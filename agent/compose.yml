# Two ways to reach the sidecar from a phone, both terminating TLS in front of
# it. The agent port is never published on its own: the pairing token is the
# only credential, so nothing that speaks plain HTTP should see it.
#
#   docker compose --profile tailscale up -d     (recommended: private tailnet)
#   docker compose --profile caddy up -d         (public domain)
#
# Credentials: put CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` in .env,
# or leave it empty and run once:
#   docker compose exec -it agent claude auth login

services:
  agent:
    image: ${FZT_AGENT_IMAGE:-docker.io/vrwarp/fanzitong-agent:latest}
    build:
      context: ..
      dockerfile: agent/Dockerfile
    env_file: .env
    environment:
      FZT_AGENT_HOST: 0.0.0.0
    volumes:
      - claude-data:/data
    restart: unless-stopped
    # No published ports: the only ways in are the two proxies below, both of
    # which reach this container by its compose network name.
    expose: ['8787']

  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:latest
    hostname: fanzitong-agent
    environment:
      # Required for this profile, but not marked as such: compose interpolates
      # every service even when its profile is not selected, so demanding it
      # here would break `docker compose up` for anyone using Caddy instead.
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_HOSTNAME: fanzitong-agent
    volumes:
      - tailscale-state:/var/lib/tailscale
      # serve.json proxies the tailnet HTTPS endpoint to http://agent:8787.
      - ./tailscale:/config:ro
    depends_on: [agent]
    cap_add: [net_admin, net_raw]
    restart: unless-stopped

  caddy:
    profiles: [caddy]
    image: caddy:2
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [agent]
    restart: unless-stopped

volumes:
  claude-data:
  tailscale-state:
  caddy-data:

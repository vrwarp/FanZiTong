# The sidecar behind Caddy, which gets a certificate for your domain on first
# start. Nothing else is published: the assistant's own port stays inside the
# compose network.
#
#   cp .env.example .env      # set FZT_DOMAIN and FZT_ALLOWED_ORIGINS
#   docker compose up -d
#
# Then open the app, put the address in Settings, and sign in with Claude. The
# first sign-in claims the assistant; after that only a signed-in device can
# start another one.

services:
  agent:
    image: ${FZT_AGENT_IMAGE:-docker.io/vrwarp/fanzitong-agent:latest}
    build:
      context: ..
      dockerfile: agent/Dockerfile
    env_file: .env
    environment:
      FZT_AGENT_HOST: 0.0.0.0
    volumes:
      # Credentials, sessions and transcripts: keep this and the assistant
      # stays signed in across restarts.
      - claude-data:/data
    expose: ['8787']
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ['80:80', '443:443']
    environment:
      FZT_DOMAIN: ${FZT_DOMAIN:?set FZT_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [agent]
    restart: unless-stopped

volumes:
  claude-data:
  caddy-data:
  caddy-config:
